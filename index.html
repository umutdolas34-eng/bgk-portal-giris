<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; frame-src https://script.google.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>BGK × Beymen Xdock Operasyon Portalı</title>
  <style>
    :root{color-scheme:light;font-family:Inter,Segoe UI,Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f7fb}
    #portalFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
    #loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f4f7fb;color:#10203a;transition:opacity .2s ease}
    #loading.hidden{opacity:0;pointer-events:none}
    .card{width:min(92vw,520px);padding:38px;border:1px solid #dce5ef;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(20,38,69,.12);text-align:center}
    .logo{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:16px;background:#315ee8;color:#fff;font-weight:800;margin-bottom:18px}
    h1{font-size:22px;margin:0 0 10px}
    p{margin:0 0 22px;color:#66758a;line-height:1.55}
    .spinner{width:32px;height:32px;margin:0 auto;border:3px solid #dce5ef;border-top-color:#315ee8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <div class="logo" aria-hidden="true">BGK</div>
      <h1>Operasyon Portalı açılıyor</h1>
      <p>Güvenli portal hazırlanıyor.</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>
  <iframe id="portalFrame" title="BGK × Beymen Xdock Operasyon Portalı" credentialless></iframe>
  <script>
    (function(){
      'use strict';
      var portal='https://script.google.com/macros/s/AKfycbx-bu6vD8JNXMi6UAFxjvDcuva9lmaVo1sj3WG08xo5DeAebox3686lC-vXx3oZF6g9-g/exec';
      var target=new URL(portal);
      target.searchParams.set('via','github-pages-embed');
      var current=new URL(window.location.href);
      var reset=current.searchParams.get('reset');
      if(reset) target.searchParams.set('reset',reset);
      var frame=document.getElementById('portalFrame');
      var loading=document.getElementById('loading');
      frame.addEventListener('load',function(){
        window.setTimeout(function(){loading.classList.add('hidden')},450);
      },{once:true});
      frame.src=target.toString();
      window.setTimeout(function(){loading.classList.add('hidden')},4500);
    })();
  </script>
</body>
</html>
