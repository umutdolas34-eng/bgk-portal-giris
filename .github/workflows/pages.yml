name: BGK Portal Gateway Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Portal giriş adresini yayımla
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: GitHub Pages hazırla
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Giriş sayfasını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
